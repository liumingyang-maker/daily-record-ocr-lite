name: Desktop formal release gate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing commit or vX.Y.Z tag to build; this workflow does not create a release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-signed-candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require formal signing secrets
        run: python scripts/build_desktop.py gate windows --formal
      - name: Install, test and build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pytest pytest-asyncio
          choco install innosetup --no-progress -y
          python -m pytest -m real_ocr -q -s --junitxml=real-ocr-windows.xml
          python scripts/assert_junit_passed.py real-ocr-windows.xml
          python -m PyInstaller --noconfirm --clean packaging/desktop/daily_record_ocr.spec
          $data = Join-Path $env:RUNNER_TEMP "daily-record-ocr-data"
          $exe = Join-Path $PWD "dist\DailyRecordOCR\DailyRecordOCR.exe"
          foreach ($mode in @("--smoke-test", "--install-models", "--ocr-test")) {
            $process = Start-Process -FilePath $exe -ArgumentList @($mode, "--data-dir", $data) -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "$mode failed with exit code $($process.ExitCode)" }
          }
      - name: Sign application and installer
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "desktop-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe not found" }
          $exe = Join-Path $PWD "dist\DailyRecordOCR\DailyRecordOCR.exe"
          & $signTool.FullName sign /f $certificate /p $env:WINDOWS_SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          & $signTool.FullName verify /pa $exe
          $version = python -c "from lite_app import __version__; print(__version__)"
          $base = python scripts/build_desktop.py name windows $version --formal
          $outputName = [IO.Path]::GetFileNameWithoutExtension($base)
          iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\DailyRecordOCR" "/DOutputName=$outputName" packaging\windows\setup.iss
          $installer = Join-Path artifacts $base
          & $signTool.FullName sign /f $certificate /p $env:WINDOWS_SIGN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
          & $signTool.FullName verify /pa $installer
          python scripts/build_desktop.py metadata windows x64 $env:GITHUB_SHA artifacts $installer
          Remove-Item -LiteralPath $certificate -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-signed-release-candidate
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-provenance.json
          if-no-files-found: error

  macos-notarized-candidate:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require formal signing and notarization secrets
        run: python scripts/build_desktop.py gate macos --formal
      - name: Import Developer ID certificate
        run: |
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/desktop-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN"
      - name: Install, test and build
        run: |
          test "$(uname -m)" = "arm64"
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.1
          python -m pip install -r requirements-desktop.txt pytest pytest-asyncio
          python -m pytest -m real_ocr -q -s --junitxml=real-ocr-macos.xml
          python scripts/assert_junit_passed.py real-ocr-macos.xml
          python -m PyInstaller --noconfirm --clean packaging/desktop/daily_record_ocr.spec
          APP="dist/DailyRecordOCR.app/Contents/MacOS/DailyRecordOCR"
          "$APP" --smoke-test --data-dir "$RUNNER_TEMP/daily-record-ocr-data"
          "$APP" --install-models --data-dir "$RUNNER_TEMP/daily-record-ocr-data"
          "$APP" --ocr-test --data-dir "$RUNNER_TEMP/daily-record-ocr-data"
      - name: Sign, notarize and staple DMG
        run: |
          version="$(python -c 'from lite_app import __version__; print(__version__)')"
          bash packaging/macos/build_dmg.sh "$version" formal
          artifact="artifacts/$(python scripts/build_desktop.py name macos "$version" --formal)"
          xcrun stapler validate "$artifact"
          hdiutil verify "$artifact"
          mount_point="$(mktemp -d)"
          hdiutil attach "$artifact" -nobrowse -mountpoint "$mount_point"
          codesign --verify --deep --strict --verbose=2 "$mount_point/DailyRecordOCR.app"
          spctl --assess --type execute --verbose=2 "$mount_point/DailyRecordOCR.app"
          hdiutil detach "$mount_point"
          rmdir "$mount_point"
          python scripts/build_desktop.py metadata macos arm64 "$GITHUB_SHA" artifacts "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-notarized-release-candidate
          path: |
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
            artifacts/build-provenance.json
          if-no-files-found: error
