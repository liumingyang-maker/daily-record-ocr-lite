name: Windows install smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run CPU installer
        shell: powershell
        run: .\install\install-windows.ps1 -OcrMode Cpu
      - name: Verify Paddle, app health, and doctor
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe -c "import paddle; paddle.utils.run_check()"
          .\.venv\Scripts\python.exe -c "from fastapi.testclient import TestClient; from lite_app.main import app; response=TestClient(app).get('/health'); assert response.status_code == 200; assert response.json()['version'] == '1.0.1'"
          .\.venv\Scripts\python.exe scripts\doctor.py --json --gate
