name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core/dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check lite_app tests_lite scripts
      - name: Core tests
        run: python -m pytest -m "not real_ocr" -q
      - name: Verify schemas and application import
        run: |
          python -c "import json, pathlib; from lite_app.contracts import validate_record_result; root=pathlib.Path('.'); result=json.loads((root/'config/mock_result.json').read_text(encoding='utf-8')); assert validate_record_result(result).ready; [json.loads(path.read_text(encoding='utf-8')) for path in (root/'config/schema').glob('*.json')]"
          python -c "from lite_app.main import app; assert app.version == '1.0.1'"
      - name: Doctor (SETUP_REQUIRED is expected without credentials)
        run: python scripts/doctor.py --json --gate
