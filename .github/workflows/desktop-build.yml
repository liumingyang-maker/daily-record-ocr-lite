name: Desktop installer test builds

on:
  pull_request:
    branches: [master, feat/evidence-first-product-workflow]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "packaging/**"
      - "lite_app/**"
      - "scripts/build_desktop.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests_lite/test_desktop_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-unsigned:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: desktop-ppocrv6-medium-windows-x64-py311-v1
      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install pytest pytest-asyncio
          choco install innosetup --no-progress -y
      - name: TDD and real OCR source gates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest tests_lite/test_desktop_packaging.py tests_lite/test_desktop_launcher.py tests_lite/test_desktop_migration.py tests_lite/test_platform_paths.py -q
          python -m pytest -m real_ocr -q -s --junitxml=artifacts/real-ocr-windows.xml
          python scripts/assert_junit_passed.py artifacts/real-ocr-windows.xml
      - name: Build PyInstaller onedir
        run: python -m PyInstaller --noconfirm --clean packaging/desktop/daily_record_ocr.spec
      - name: Frozen launcher, health and real OCR gates
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\DailyRecordOCR\DailyRecordOCR.exe"
          $data = Join-Path $env:RUNNER_TEMP "daily-record-ocr-data"
          foreach ($mode in @("--self-test", "--smoke-test", "--install-models", "--ocr-test")) {
            $label = $mode.TrimStart("-")
            $stdout = Join-Path $env:RUNNER_TEMP "$label.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "$label.stderr.log"
            $process = Start-Process -FilePath $exe -ArgumentList @($mode, "--data-dir", $data) -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (Test-Path $stdout) { Get-Content $stdout }
            if ($process.ExitCode -ne 0 -and (Test-Path $stderr)) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) { throw "$mode failed with exit code $($process.ExitCode)" }
          }
      - name: Build unsigned Inno Setup installer
        shell: pwsh
        run: |
          $version = python -c "from lite_app import __version__; print(__version__)"
          $base = python scripts/build_desktop.py name windows $version
          $outputName = [IO.Path]::GetFileNameWithoutExtension($base)
          iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist\DailyRecordOCR" "/DOutputName=$outputName" packaging\windows\setup.iss
          python scripts/build_desktop.py metadata windows x64 $env:GITHUB_SHA artifacts (Join-Path artifacts $base)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned-test-installer
          path: |
            artifacts/*-UNSIGNED.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-provenance.json
            artifacts/real-ocr-windows.xml
          if-no-files-found: error
          retention-days: 7

  macos-arm64-unsigned:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: desktop-ppocrv6-medium-macos-arm64-py311-v1
      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.3.1 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install -r requirements-desktop.txt
          python -m pip install pytest pytest-asyncio
      - name: TDD and real OCR source gates
        run: |
          mkdir -p artifacts
          python -m pytest tests_lite/test_desktop_packaging.py tests_lite/test_desktop_launcher.py tests_lite/test_desktop_migration.py tests_lite/test_platform_paths.py -q
          python -m pytest -m real_ocr -q -s --junitxml=artifacts/real-ocr-macos.xml
          python scripts/assert_junit_passed.py artifacts/real-ocr-macos.xml
      - name: Build PyInstaller app bundle
        run: python -m PyInstaller --noconfirm --clean packaging/desktop/daily_record_ocr.spec
      - name: Frozen launcher, health and real OCR gates
        run: |
          APP="dist/DailyRecordOCR.app/Contents/MacOS/DailyRecordOCR"
          DATA="$RUNNER_TEMP/daily-record-ocr-data"
          "$APP" --self-test --data-dir "$DATA"
          "$APP" --smoke-test --data-dir "$DATA"
          "$APP" --install-models --data-dir "$DATA"
          "$APP" --ocr-test --data-dir "$DATA"
      - name: Build and verify unsigned DMG
        run: |
          version="$(python -c 'from lite_app import __version__; print(__version__)')"
          bash packaging/macos/build_dmg.sh "$version" unsigned
          artifact="artifacts/$(python scripts/build_desktop.py name macos "$version")"
          hdiutil verify "$artifact"
          python scripts/build_desktop.py metadata macos arm64 "$GITHUB_SHA" artifacts "$artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-unsigned-test-dmg
          path: |
            artifacts/*-UNSIGNED.dmg
            artifacts/SHA256SUMS.txt
            artifacts/build-provenance.json
            artifacts/real-ocr-macos.xml
          if-no-files-found: error
          retention-days: 7
