<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}手写记录识别{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-row">
                <h1><a href="/">手写配方识别</a></h1>
                <nav>
                    <a href="/">开始识别</a>
                    <a href="/jobs">识别记录</a>
                    <a href="/knowledge">配方知识库</a>
                    <a href="/settings">设置</a>
                </nav>
            </div>
        </header>
        {% if demo_mode %}
        <div class="global-banner demo-banner" role="alert">
            <strong>演示模式：</strong>当前使用固定 Mock 结果，不代表真实识别，也不对应上传图片。
            导出文件会带有 <code>DEMO-</code> 前缀。
        </div>
        {% elif setup_state == "SETUP_REQUIRED" %}
        <div class="global-banner setup-banner" role="alert">
            <strong>尚未完成配置。</strong>真实识别已锁定，请前往
            <a href="/setup">安装后配置</a>。
        </div>
        {% endif %}
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>daily-record-ocr-lite v{{ version }}</footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
